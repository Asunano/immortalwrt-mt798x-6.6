name: build-rax3000m-nand-itb

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release tag/name for the built itb'
        required: false
        default: 'rax3000m-nand-itb'
  push:
    branches:
      - openwrt-24.10-6.6
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed to upload release asset
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache xxd

      - name: Checkout source (this repo, openwrt-24.10-6.6)
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
          fetch-depth: 1

      - name: Cache ccache + downloaded sources (dl)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            dl
          key: rax3000m-itb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rax3000m-itb-${{ runner.os }}-

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load base defconfig then apply incremental tweaks
        run: |
          # 1) start from the known-good base defconfig
          cp defconfig/mt7981-ax3000.config .config
          make defconfig
          # 2) apply device + argon tweaks, then re-run defconfig to resolve them
          sed -i -E 's/^(CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.+)=y$/# \1 is not set/' .config
          sed -i -E 's|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m) is not set$|\1=y|' .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-argon-config=y' >> .config
          # --- Tweak 4: add the 5 requested apps (all confirmed to exist in feeds) ---
          echo 'CONFIG_PACKAGE_luci-app-autoreboot=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-nlbwmon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-commands=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-upnp=y' >> .config
          # --- Tweak 5: USB tethering (phone/tablet -> router) kernel modules ---
          echo 'CONFIG_PACKAGE_kmod-usb-net=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net-rndis=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' >> .config
          # --- Tweak 6: enable ccache so rebuilds reuse compiled objects ---
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          # 3) CRITICAL: a second defconfig re-injects feeds-default options (incl. passwall),
          #    so strip proxy shells AFTER the final defconfig. No further defconfig after this
          #    — `make` will oldconfig the rest and won't resurrect deleted lines.
          sed -i -E '/luci-app-ssr-plus/d' .config
          sed -i -E '/luci-app-passwall/d' .config
          sed -i -E '/ssr-plus_INCLUDE/d' .config
          sed -i -E '/PASSWALL/d' .config

      - name: Verify (hard-fail on proxy, confirm device + driver)
        run: |
          echo "=== cmcc_rax3000m (NAND) selected? ==="
          grep -q "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m=y" .config || { echo "FAIL: cmcc_rax3000m NOT selected"; exit 1; }
          echo "=== closed-source mtwifi driver? ==="
          grep -q "CONFIG_MTK_WIFI_DRIVER=y" .config || { echo "FAIL: closed-source mtwifi NOT enabled"; exit 1; }
          echo "=== NO proxy shells? (hard fail) ==="
          grep -q "luci-app-ssr-plus" .config && { echo "FAIL: ssr-plus still present"; exit 1; }
          grep -q "luci-app-passwall" .config && { echo "FAIL: passwall still present"; exit 1; }
          echo "=== Argon theme resolved? (warn only) ==="
          grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config && echo "OK argon theme resolved" || echo "WARN: luci-theme-argon NOT resolved"
          echo "=== OpenClash resolved? (warn only) ==="
          grep -q "CONFIG_PACKAGE_luci-app-openclash=y" .config && echo "WARN: openclash unexpectedly present" || echo "OK openclash removed"
          echo "=== USB tethering kmods resolved? (warn only) ==="
          for k in kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm; do
            grep -q "CONFIG_PACKAGE_$k=y" .config && echo "OK $k resolved" || echo "WARN: $k NOT resolved"
          done
          echo "=== ccache enabled? (warn only) ==="
          grep -q "CONFIG_CCACHE=y" .config && echo "OK ccache enabled" || echo "WARN: ccache NOT enabled"
          echo "VERIFY DONE"

      - name: Download packages
        run: make download -j$(nproc)

      - name: Build (parallel, ccache-accelerated)
        run: |
          export CCACHE_DIR=$HOME/.ccache
          make V=s -j$(nproc)

      - name: Show built artifacts
        run: ls -lh bin/targets/mediatek/filogic/ | grep -i rax3000m

      - name: Upload sysupgrade itb to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_name || 'rax3000m-nand-itb' }}
          name: RAX3000M NAND itb (closed-source 24.10)
          files: bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cmcc_rax3000m-squashfs-sysupgrade.itb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
